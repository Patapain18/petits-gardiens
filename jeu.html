<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover : sur un iPhone couché, le jeu va jusqu'aux bords (l'encoche est évitée dans style.css) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Petits Gardiens</title>
  <meta name="description" content="Petits Gardiens, un tower defense à travers les époques du jeu vidéo : des petits monstres gardiens protègent leur château." />
  <!-- Sans niveau dans l'adresse (jeu.html?niveau=monde1-1), on retourne à la carte des époques -->
  <script>if (!new URLSearchParams(location.search).get('niveau')) location.replace('./');</script>
  <!-- Installé sur l'écran d'accueil d'un téléphone (voir public/manifest.webmanifest) : le jeu s'ouvre
       en plein écran, sans les barres du navigateur -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icones/apple-touch-icon.png" />
  <meta name="theme-color" content="#1a1420" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Petits Gardiens" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='3' y='4' width='10' height='6' fill='%23f0803a'/%3E%3Crect x='1' y='6' width='2' height='2' fill='%23f0803a'/%3E%3Crect x='13' y='6' width='2' height='2' fill='%23f0803a'/%3E%3Crect x='5' y='6' width='1' height='2' fill='%231a1014'/%3E%3Crect x='10' y='6' width='1' height='2' fill='%231a1014'/%3E%3Crect x='4' y='10' width='1' height='2' fill='%23b8522a'/%3E%3Crect x='6' y='10' width='1' height='2' fill='%23b8522a'/%3E%3Crect x='9' y='10' width='1' height='2' fill='%23b8522a'/%3E%3Crect x='11' y='10' width='1' height='2' fill='%23b8522a'/%3E%3Crect x='7' y='2' width='2' height='2' fill='%23ffd23a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body data-style="voxel">
  <!-- Le style graphique choisi dessine dans cette zone -->
  <div id="scene" aria-label="Plateau de jeu"></div>

  <!-- Barre du haut : ressources + choix du style -->
  <header class="barre">
    <div class="panneau ressources">
      <span class="ressource" title="Pièces d'or"><span class="piece" aria-hidden="true"></span><b id="or">0</b></span>
      <span class="ressource">Vague <b id="vague">0 / 5</b></span>
      <span class="ressource" id="ligne-record" hidden>Record <b id="record">0</b></span>
      <a class="bouton-lien" href="./">Carte</a>
      <a id="lien-editeur" class="bouton-lien" href="./editeur.html" hidden>Modifier dans l'éditeur</a>
    </div>
    <div class="panneau choix" role="group" aria-label="Style graphique">
      <span class="etiquette">Style</span>
      <button data-style="voxel" aria-pressed="true">Voxel doré</button>
      <button data-style="cartoon" aria-pressed="false">Diorama cartoon</button>
      <button data-style="pixel" aria-pressed="false">Pixel art</button>
    </div>
  </header>

  <!-- Réglages d'affichage : l'ambiance (les trois styles) et la caméra (voxel) -->
  <div class="panneau choix reglages" id="reglages" role="group" aria-label="Ambiance">
    <span class="etiquette">Ambiance</span>
    <button data-ambiance="doree" aria-pressed="true">Heure dorée</button>
    <button data-ambiance="aube" aria-pressed="false">Aube brumeuse</button>
    <button data-ambiance="midi" aria-pressed="false">Plein midi</button>
    <button data-ambiance="nuit" aria-pressed="false">Nuit</button>
    <span class="groupe-camera">
      <span class="etiquette">Caméra</span>
      <button data-camera="haute" aria-pressed="true">Vue de jeu</button>
      <button data-camera="cinema" aria-pressed="false">Cinéma</button>
    </span>
  </div>

  <!-- Commandes du bas -->
  <footer class="barre bas">
    <div class="colonne-bas">
      <!-- L'aperçu de la prochaine vague, juste au-dessus du bouton, pendant la préparation (rempli par main.js) -->
      <div id="apercu" class="panneau apercu" role="status" aria-live="polite" hidden></div>
      <div class="panneau">
        <button id="lancer" class="principal">Lancer la vague 1</button>
        <!-- Les pouvoirs du château (seulement dans les niveaux qui en donnent, comme l'arène) -->
        <span id="pouvoirs" class="pouvoirs" hidden>
          <button class="pouvoir" data-pouvoir="meteore"><span class="nom-pouvoir">Météore</span><span class="etat-pouvoir"></span><kbd class="touche"></kbd></button>
          <button class="pouvoir" data-pouvoir="froid"><span class="nom-pouvoir"><span class="nom-long">Grand froid</span><span class="nom-court">Froid</span></span><span class="etat-pouvoir"></span><kbd class="touche"></kbd></button>
        </span>
        <!-- Le héros (seulement dans les niveaux qui en ont un) : son niveau, sa vie et son expérience -->
        <button id="bouton-heros" class="bouton-heros" hidden><span class="nom-heros"><span class="nom-long">Grand Gardien</span><span class="nom-court">Héros</span></span><span class="niveau-heros"></span><kbd class="touche">H</kbd><span class="vie-heros" aria-hidden="true"></span><span class="xp-heros" aria-hidden="true"></span></button>
        <!-- Les pouvoirs du héros : ses niveaux les débloquent (l'Onde de choc au 4, le Bond au 6).
             Sur un téléphone, avant ce niveau, le bouton se fait tout petit : un cadenas et le niveau -->
        <span id="pouvoirs-heros" class="pouvoirs" hidden>
          <button class="pouvoir" data-pouvoir-heros="onde"><span class="nom-pouvoir">Onde</span><span class="etat-pouvoir"></span><span class="cadenas" aria-hidden="true"><svg viewBox="0 0 8 10" width="9" height="11" shape-rendering="crispEdges"><path d="M2 0h4v1h1v3H6V1H2v3H1V1h1z" fill="currentColor"/><path d="M0 4h8v6H0z" fill="currentColor"/><path d="M3 6h2v2H3z" fill="#000" opacity="0.45"/></svg><span class="niveau-requis"></span></span><kbd class="touche">O</kbd></button>
          <button class="pouvoir" data-pouvoir-heros="bond"><span class="nom-pouvoir">Bond</span><span class="etat-pouvoir"></span><span class="cadenas" aria-hidden="true"><svg viewBox="0 0 8 10" width="9" height="11" shape-rendering="crispEdges"><path d="M2 0h4v1h1v3H6V1H2v3H1V1h1z" fill="currentColor"/><path d="M0 4h8v6H0z" fill="currentColor"/><path d="M3 6h2v2H3z" fill="#000" opacity="0.45"/></svg><span class="niveau-requis"></span></span><kbd class="touche">B</kbd></button>
        </span>
      </div>
    </div>
    <div class="panneau commandes">
      <button id="vitesse" title="Vitesse du jeu">Vitesse ×1</button>
      <button id="pause" aria-pressed="false">Pause</button>
      <button id="recommencer">Recommencer</button>
      <button id="bouton-options" aria-haspopup="dialog">Options</button>
      <!-- Sur un téléphone, dans le menu : le plein écran (seulement si le navigateur sait le faire) -->
      <button id="plein-ecran" class="plein-ecran" hidden>Plein écran</button>
      <!-- Sur un téléphone couché : le menu (le style, l'ambiance, la vitesse, recommencer, les options, la carte) -->
      <button id="bouton-menu-telephone" class="bouton-menu-telephone" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
    <!-- Sur un téléphone couché : les pouvoirs et le héros, en bas à droite (main.js y range leurs boutons) -->
    <div id="coin-pouvoirs" class="panneau coin-pouvoirs"></div>
  </footer>
  <div id="voile-menu-telephone" class="voile-menu-telephone" aria-hidden="true"></div>


  <!-- Menu qui s'ouvre quand on clique sur un socle -->
  <div id="menu" class="panneau menu" role="dialog" aria-label="Choisir un gardien" hidden></div>
  <!-- Au doigt : la roue des gardiens autour du socle (remplie par main.js) -->
  <div id="roue" class="roue" role="dialog" aria-label="Choisir un gardien" hidden></div>
  <!-- Au doigt : une bulle au-dessus des boutons. Elle dit où toucher quand on vise (le Météore, le
       Bond) ou qu'on déplace le héros, et pourquoi un pouvoir ne part pas (remplie par main.js) -->
  <div id="bulle-boutons" class="panneau bulle-boutons" role="status" aria-live="polite" hidden>
    <p><strong class="titre-bulle"></strong><span class="texte-bulle"></span><span class="detail-bulle"></span></p>
    <button class="annuler-bulle">Annuler</button>
  </div>
  <!-- Sur un téléphone tenu debout : le plateau serait minuscule -->
  <div id="tourner" class="tourner" role="alert">
    <div class="panneau carte">
      <svg class="telephone-qui-tourne" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><rect x="20" y="6" width="24" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="50" r="2.5" fill="currentColor"/></svg>
      <p>Tourne ton téléphone pour jouer&nbsp;: le plateau a besoin de toute la largeur.</p>
    </div>
  </div>

  <!-- Petits textes « +6 » qui s'envolent quand un monstre meurt -->
  <div id="bulles" aria-hidden="true"></div>
  <!-- Le Grand froid : un voile de givre sur les bords de l'écran -->
  <div id="givre" aria-hidden="true"></div>
  <!-- Les bénédictions déjà choisies (sous la barre du haut) -->
  <div id="mes-benedictions" class="mes-benedictions" aria-label="Tes bénédictions" hidden></div>
  <!-- Toutes les 5 vagues : une bénédiction à choisir parmi 3 (remplie par main.js) -->
  <div id="benediction" class="voile voile-benediction" hidden>
    <div class="panneau carte benediction" role="dialog" aria-modal="true" aria-labelledby="benediction-titre">
      <p class="surtitre">Bénédiction</p>
      <h2 id="benediction-titre"></h2>
      <p class="aide-benediction">Choisis un bonus&nbsp;: il reste jusqu’à la fin de la partie.</p>
      <div class="choix-benedictions" id="choix-benedictions"></div>
    </div>
  </div>

  <!-- Messages : début, victoire, défaite (remplis par main.js) -->
  <div id="message" class="voile">
    <div class="panneau carte"></div>
  </div>

  <!-- Didacticiel : la fiche qui présente un nouveau personnage -->
  <div id="presentation" class="voile voile-presentation" hidden>
    <div class="panneau carte presentation" role="dialog" aria-modal="true" aria-labelledby="presentation-nom">
      <p class="surtitre" id="presentation-sorte"></p>
      <div class="presentation-corps">
        <div class="portrait" id="presentation-portrait"></div>
        <div class="presentation-texte">
          <h2 id="presentation-nom"></h2>
          <p id="presentation-description"></p>
          <ul class="caracteristiques" id="presentation-chiffres"></ul>
        </div>
      </div>
      <p class="conseil-perso"><strong>Conseil&nbsp;:</strong> <span id="presentation-conseil"></span></p>
      <button class="principal" id="presentation-ok">Compris&nbsp;!</button>
    </div>
  </div>

  <!-- Didacticiel : la leçon en cours, et la flèche qui montre où cliquer -->
  <div id="lecon" class="panneau lecon" role="status" aria-live="polite" hidden>
    <strong id="lecon-titre"></strong>
    <p id="lecon-texte"></p>
  </div>
  <div id="indice" class="indice" aria-hidden="true" hidden>
    <svg viewBox="0 0 14 16" width="34" height="39" shape-rendering="crispEdges"><path d="M4 1h6v7h3l-6 7l-6-7h3z" fill="#ffd24a" stroke="#2a1208" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 2h2v6H5z" fill="#fff4b0"/></svg>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
